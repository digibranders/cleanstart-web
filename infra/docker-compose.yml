services:
  postgres:
    image: postgres:16-alpine
    container_name: cleanstart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cleanstart
      POSTGRES_PASSWORD: cleanstart
      POSTGRES_DB: cleanstart
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cleanstart -d cleanstart"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
    driver: local
