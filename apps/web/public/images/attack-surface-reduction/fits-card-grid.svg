<svg preserveAspectRatio="none" width="100%" height="100%" viewBox="0 0 388 388" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- Figma Group 2085665239 — guide lines for the integration card.
     Card is square (404×404 outer / 388×388 inner). Geometry recomputed for
     square viewBox so verticals + horizontals land at the same proportional
     positions regardless of card size (preserveAspectRatio="none" stretch). -->

<!-- 2 horizontal guide lines, opacity 0.22 -->
<rect x="0" y="111"  width="388" height="1" fill="url(#paint_h1)"/>
<rect x="0" y="281"  width="388" height="1" fill="url(#paint_h2)"/>

<!-- 4 vertical guide lines, opacity 0.30 -->
<rect x="68"  y="0" width="1" height="388" fill="url(#paint_v1)"/>
<rect x="166" y="0" width="1" height="388" fill="url(#paint_v2)"/>
<rect x="224" y="0" width="1" height="388" fill="url(#paint_v3)"/>
<rect x="322" y="0" width="1" height="388" fill="url(#paint_v4)"/>

<defs>
<linearGradient id="paint_h1" x1="0" y1="111.5" x2="388" y2="111.5" gradientUnits="userSpaceOnUse">
<stop stop-color="#1a1a3a" stop-opacity="0"/>
<stop offset="0.5077" stop-color="#1a1a3a" stop-opacity="0.22"/>
<stop offset="1" stop-color="#1a1a3a" stop-opacity="0"/>
</linearGradient>
<linearGradient id="paint_h2" x1="0" y1="281.5" x2="388" y2="281.5" gradientUnits="userSpaceOnUse">
<stop stop-color="#1a1a3a" stop-opacity="0"/>
<stop offset="0.5077" stop-color="#1a1a3a" stop-opacity="0.22"/>
<stop offset="1" stop-color="#1a1a3a" stop-opacity="0"/>
</linearGradient>
<linearGradient id="paint_v1" x1="68.5" y1="0" x2="68.5" y2="388" gradientUnits="userSpaceOnUse">
<stop stop-color="#1a1a3a" stop-opacity="0"/>
<stop offset="0.5077" stop-color="#1a1a3a" stop-opacity="0.30"/>
<stop offset="1" stop-color="#1a1a3a" stop-opacity="0"/>
</linearGradient>
<linearGradient id="paint_v2" x1="166.5" y1="0" x2="166.5" y2="388" gradientUnits="userSpaceOnUse">
<stop stop-color="#1a1a3a" stop-opacity="0"/>
<stop offset="0.5077" stop-color="#1a1a3a" stop-opacity="0.30"/>
<stop offset="1" stop-color="#1a1a3a" stop-opacity="0"/>
</linearGradient>
<linearGradient id="paint_v3" x1="224.5" y1="0" x2="224.5" y2="388" gradientUnits="userSpaceOnUse">
<stop stop-color="#1a1a3a" stop-opacity="0"/>
<stop offset="0.5077" stop-color="#1a1a3a" stop-opacity="0.30"/>
<stop offset="1" stop-color="#1a1a3a" stop-opacity="0"/>
</linearGradient>
<linearGradient id="paint_v4" x1="322.5" y1="0" x2="322.5" y2="388" gradientUnits="userSpaceOnUse">
<stop stop-color="#1a1a3a" stop-opacity="0"/>
<stop offset="0.5077" stop-color="#1a1a3a" stop-opacity="0.30"/>
<stop offset="1" stop-color="#1a1a3a" stop-opacity="0"/>
</linearGradient>
</defs>
</svg>
