name: Deploy CMS

# Gate prod deploys on a successful CMS CI run for the same commit.
#
# `workflow_run` fires after CMS CI completes — pass or fail — so the job
# below guards on `conclusion == 'success'` to skip failed runs. We deploy
# the exact SHA CI verified (`workflow_run.head_sha`), not the moving
# branch HEAD, to keep CI evidence and the deployed artifact in lockstep.
#
# Manual override stays via workflow_dispatch (input SHA, no CI check) for
# incidents where CI is wedged but a forward-only fix must ship.
on:
  workflow_run:
    workflows: ['CMS CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Optional git SHA to deploy (defaults to the branch HEAD this run was triggered from)'
        required: false

# Serialize deploys to the prod droplet — no two builds racing the same `cms:current` tag.
concurrency:
  group: deploy-cms-prod
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_run fires on every CI completion, including failures. Only
    # ship green ones. workflow_dispatch has no workflow_run context, so
    # the second clause keeps manual deploys functional.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Single source of truth for the SHA to deploy. `github.sha` is the
    # right value for workflow_dispatch (branch HEAD), but for
    # workflow_run it points at the default-branch tip — not the commit
    # CI verified. Image tags, docker tag operations, and the checkout
    # all reference DEPLOY_SHA so the artifact and the CI evidence match.
    env:
      DEPLOY_SHA: >-
        ${{ inputs.sha
            || github.event.workflow_run.head_sha
            || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      # Buildx + GHA cache shaves ~1–2 min off subsequent builds by reusing
      # pnpm install + intermediate Next.js layers across runs. First build
      # after this change populates the cache (no speedup); every later
      # source-only change benefits. Cache lives in the repo's Actions cache
      # (10 GB cap, LRU-evicted by GitHub).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (cms:${{ env.DEPLOY_SHA }})
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/cms/Dockerfile
          tags: cms:${{ env.DEPLOY_SHA }}
          load: true
          cache-from: type=gha,scope=cms-deploy
          cache-to: type=gha,scope=cms-deploy,mode=max

      - name: Save image tarball
        run: docker save cms:${{ env.DEPLOY_SHA }} | gzip > /tmp/cms.tar.gz

      - name: Set up SSH to droplet
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DROPLET_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan ${{ secrets.DROPLET_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Ship image to droplet
        run: |
          scp -i ~/.ssh/id_deploy /tmp/cms.tar.gz \
            ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}:/tmp/cms.tar.gz

      # Render /opt/cleanstart/.env on the droplet from individual GitHub
      # Variables (non-secret config) and Secrets (sensitive tokens). One
      # source of truth per key — to update a value, edit it in the GitHub
      # UI and re-run this workflow.
      #
      # GOOGLE_APPLICATION_CREDENTIALS_JSON must be single-line (compact
      # JSON) in the secret; line breaks break dotenv parsing.
      - name: Render .env to droplet
        env:
          # Variables
          NODE_ENV: ${{ vars.NODE_ENV }}
          PORT: ${{ vars.PORT }}
          PAYLOAD_AUTO_RUN: ${{ vars.PAYLOAD_AUTO_RUN }}
          PAYLOAD_PUBLIC_ENV: ${{ vars.PAYLOAD_PUBLIC_ENV }}
          PAYLOAD_PUBLIC_SERVER_URL: ${{ vars.PAYLOAD_PUBLIC_SERVER_URL }}
          PAYLOAD_PUBLIC_ROBOTS_DISALLOW: ${{ vars.PAYLOAD_PUBLIC_ROBOTS_DISALLOW }}
          PAYLOAD_CORS_ORIGINS: ${{ vars.PAYLOAD_CORS_ORIGINS }}
          TRUSTED_PROXY_HOPS: ${{ vars.TRUSTED_PROXY_HOPS }}
          WEB_CONCURRENCY: ${{ vars.WEB_CONCURRENCY }}
          RATE_LIMIT_BACKEND: ${{ vars.RATE_LIMIT_BACKEND }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_PUBLIC_BASE: ${{ vars.R2_PUBLIC_BASE }}
          R2_UPLOAD_PREFIX: ${{ vars.R2_UPLOAD_PREFIX }}
          R2_RESUME_PREFIX: ${{ vars.R2_RESUME_PREFIX }}
          MEILISEARCH_URL: ${{ vars.MEILISEARCH_URL }}
          LEAD_QUEUE_LOCAL_DIR: ${{ vars.LEAD_QUEUE_LOCAL_DIR }}
          LEAD_SUBMIT_ALLOWED_ORIGINS: ${{ vars.LEAD_SUBMIT_ALLOWED_ORIGINS }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SITE_ORIGIN: ${{ vars.NEXT_PUBLIC_SITE_ORIGIN }}
          NEXT_PUBLIC_SITE_HOSTS: ${{ vars.NEXT_PUBLIC_SITE_HOSTS }}
          WEB_BASE_URL: ${{ vars.WEB_BASE_URL }}
          WEB_REVALIDATE_URL: ${{ vars.WEB_REVALIDATE_URL }}
          HUBSPOT_PORTAL_ID: ${{ vars.HUBSPOT_PORTAL_ID }}
          BREVO_SENDER_EMAIL: ${{ vars.BREVO_SENDER_EMAIL }}
          BREVO_SENDER_NAME: ${{ vars.BREVO_SENDER_NAME }}
          BREVO_TEMPLATE_ID: ${{ vars.BREVO_TEMPLATE_ID }}
          CAREERS_HR_EMAIL: ${{ vars.CAREERS_HR_EMAIL }}
          PARTNER_USER_TEMPLATE_ID: ${{ vars.PARTNER_USER_TEMPLATE_ID }}
          PARTNER_ADMIN_TEMPLATE_ID: ${{ vars.PARTNER_ADMIN_TEMPLATE_ID }}
          PARTNERS_NOTIFY_EMAIL: ${{ vars.PARTNERS_NOTIFY_EMAIL }}
          CLOUDFLARE_ACCOUNT_TAG: ${{ vars.CLOUDFLARE_ACCOUNT_TAG }}
          WEBHOOK_TEAMS_EVENTS: ${{ vars.WEBHOOK_TEAMS_EVENTS }}
          WEBHOOK_GENERIC_EVENTS: ${{ vars.WEBHOOK_GENERIC_EVENTS }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          PAYLOAD_DB_PUSH: ${{ vars.PAYLOAD_DB_PUSH }}
          # Secrets
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          MEILISEARCH_API_KEY: ${{ secrets.MEILISEARCH_API_KEY }}
          MEILISEARCH_MASTER_KEY: ${{ secrets.MEILISEARCH_MASTER_KEY }}
          LIVE_PREVIEW_SECRET: ${{ secrets.LIVE_PREVIEW_SECRET }}
          PREVIEW_JWT_SECRET: ${{ secrets.PREVIEW_JWT_SECRET }}
          WEB_REVALIDATE_SECRET: ${{ secrets.WEB_REVALIDATE_SECRET }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          WEBHOOK_TEAMS_URL: ${{ secrets.WEBHOOK_TEAMS_URL }}
          WEBHOOK_GENERIC_URL: ${{ secrets.WEBHOOK_GENERIC_URL }}
          WEBHOOK_GENERIC_SIGNING_SECRET: ${{ secrets.WEBHOOK_GENERIC_SIGNING_SECRET }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          HUBSPOT_PRIVATE_APP_TOKEN: ${{ secrets.HUBSPOT_PRIVATE_APP_TOKEN }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          CLARITY_API_TOKEN: ${{ secrets.CLARITY_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CALCOM_SIGNING_SECRET: ${{ secrets.CALCOM_SIGNING_SECRET }}
          BACKUP_HEARTBEAT_URL: ${{ secrets.BACKUP_HEARTBEAT_URL }}
        run: |
          # Compute DATABASE_URI from POSTGRES_PASSWORD + the well-known
          # compose service hostname so we never store two secrets that
          # could drift out of sync.
          DATABASE_URI="postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/cleanstart"

          # Render .env line-by-line; multi-line values (none expected
          # at runtime — JSON must be compact) would break dotenv parsing,
          # so we explicitly avoid printf %s and use single-line `key=value`.
          {
            echo "NODE_ENV=${NODE_ENV}"
            echo "PORT=${PORT}"
            echo "PAYLOAD_AUTO_RUN=${PAYLOAD_AUTO_RUN}"
            echo "PAYLOAD_PUBLIC_ENV=${PAYLOAD_PUBLIC_ENV}"
            echo "PAYLOAD_PUBLIC_SERVER_URL=${PAYLOAD_PUBLIC_SERVER_URL}"
            echo "PAYLOAD_PUBLIC_ROBOTS_DISALLOW=${PAYLOAD_PUBLIC_ROBOTS_DISALLOW}"
            echo "PAYLOAD_CORS_ORIGINS=${PAYLOAD_CORS_ORIGINS}"
            echo "TRUSTED_PROXY_HOPS=${TRUSTED_PROXY_HOPS}"
            echo "WEB_CONCURRENCY=${WEB_CONCURRENCY}"
            echo "RATE_LIMIT_BACKEND=${RATE_LIMIT_BACKEND}"
            echo "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
            echo "DATABASE_URI=${DATABASE_URI}"
            echo "PAYLOAD_SECRET=${PAYLOAD_SECRET}"
            echo "R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}"
            echo "R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}"
            echo "R2_BUCKET=${R2_BUCKET}"
            echo "R2_ENDPOINT=${R2_ENDPOINT}"
            echo "R2_PUBLIC_BASE=${R2_PUBLIC_BASE}"
            echo "R2_UPLOAD_PREFIX=${R2_UPLOAD_PREFIX}"
            echo "R2_RESUME_PREFIX=${R2_RESUME_PREFIX}"
            echo "MEILISEARCH_URL=${MEILISEARCH_URL}"
            echo "MEILISEARCH_API_KEY=${MEILISEARCH_API_KEY}"
            echo "MEILISEARCH_MASTER_KEY=${MEILISEARCH_MASTER_KEY}"
            echo "LEAD_QUEUE_LOCAL_DIR=${LEAD_QUEUE_LOCAL_DIR}"
            echo "LEAD_SUBMIT_ALLOWED_ORIGINS=${LEAD_SUBMIT_ALLOWED_ORIGINS}"
            echo "NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}"
            echo "NEXT_PUBLIC_SITE_ORIGIN=${NEXT_PUBLIC_SITE_ORIGIN}"
            echo "NEXT_PUBLIC_SITE_HOSTS=${NEXT_PUBLIC_SITE_HOSTS}"
            echo "WEB_BASE_URL=${WEB_BASE_URL}"
            echo "LIVE_PREVIEW_SECRET=${LIVE_PREVIEW_SECRET}"
            echo "PREVIEW_JWT_SECRET=${PREVIEW_JWT_SECRET}"
            echo "WEB_REVALIDATE_URL=${WEB_REVALIDATE_URL}"
            echo "WEB_REVALIDATE_SECRET=${WEB_REVALIDATE_SECRET}"
            echo "TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY}"
            echo "PAYLOAD_DB_PUSH=${PAYLOAD_DB_PUSH}"
            echo "TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY}"
            echo "SENTRY_DSN=${SENTRY_DSN}"
            echo "WEBHOOK_TEAMS_URL=${WEBHOOK_TEAMS_URL}"
            echo "WEBHOOK_TEAMS_EVENTS=${WEBHOOK_TEAMS_EVENTS}"
            echo "WEBHOOK_GENERIC_URL=${WEBHOOK_GENERIC_URL}"
            echo "WEBHOOK_GENERIC_EVENTS=${WEBHOOK_GENERIC_EVENTS}"
            echo "WEBHOOK_GENERIC_SIGNING_SECRET=${WEBHOOK_GENERIC_SIGNING_SECRET}"
            echo "INDEXNOW_KEY=${INDEXNOW_KEY}"
            echo "HUBSPOT_PORTAL_ID=${HUBSPOT_PORTAL_ID}"
            echo "HUBSPOT_PRIVATE_APP_TOKEN=${HUBSPOT_PRIVATE_APP_TOKEN}"
            echo "BREVO_API_KEY=${BREVO_API_KEY}"
            echo "BREVO_SENDER_EMAIL=${BREVO_SENDER_EMAIL}"
            echo "BREVO_SENDER_NAME=${BREVO_SENDER_NAME}"
            echo "BREVO_TEMPLATE_ID=${BREVO_TEMPLATE_ID}"
            echo "CAREERS_HR_EMAIL=${CAREERS_HR_EMAIL}"
            echo "PARTNER_USER_TEMPLATE_ID=${PARTNER_USER_TEMPLATE_ID}"
            echo "PARTNER_ADMIN_TEMPLATE_ID=${PARTNER_ADMIN_TEMPLATE_ID}"
            echo "PARTNERS_NOTIFY_EMAIL=${PARTNERS_NOTIFY_EMAIL}"
            echo "GOOGLE_APPLICATION_CREDENTIALS_JSON=${GOOGLE_APPLICATION_CREDENTIALS_JSON}"
            echo "CLARITY_API_TOKEN=${CLARITY_API_TOKEN}"
            echo "CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}"
            echo "CLOUDFLARE_ACCOUNT_TAG=${CLOUDFLARE_ACCOUNT_TAG}"
            echo "CALCOM_SIGNING_SECRET=${CALCOM_SIGNING_SECRET}"
            echo "BACKUP_HEARTBEAT_URL=${BACKUP_HEARTBEAT_URL}"
          } | ssh -i ~/.ssh/id_deploy \
            ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }} \
            'umask 077 && cat > /opt/cleanstart/.env && chmod 600 /opt/cleanstart/.env'

      - name: Load image + restart cms
        run: |
          ssh -i ~/.ssh/id_deploy \
            ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }} \
            'set -e
             cd /opt/cleanstart
             docker load < /tmp/cms.tar.gz
             docker tag cms:${{ env.DEPLOY_SHA }} cms:current
             docker compose --profile cms up -d --wait --wait-timeout 300 cms

             # Retention: keep cms:current + 2 most recent SHA tags for fast
             # rollback (~13 GB on the droplet). Each cms image is ~4.4 GB;
             # without pruning, daily deploys would fill the 48 GB disk in
             # under 2 weeks. docker image prune alone misses these because
             # they are tagged, not dangling.
             docker images cms --format "{{.Tag}}\t{{.CreatedAt}}" \
               | grep -v "^current\b" \
               | sort -k2 -r \
               | tail -n +3 \
               | awk "{print \$1}" \
               | xargs -r -I{} docker rmi "cms:{}" || true
             docker image prune -f

             rm -f /tmp/cms.tar.gz
             echo "--- cms container status ---"
             docker ps --filter name=cleanstart-cms-1 --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
             echo "--- last 20 lines of cms log ---"
             docker logs --tail 20 cleanstart-cms-1
             echo "--- droplet disk after deploy ---"
             df -h / | tail -1'

      - name: Smoke probe
        run: |
          ssh -i ~/.ssh/id_deploy \
            ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }} \
            'curl -sS -o /dev/null -w "local 127.0.0.1:3000 -> HTTP %{http_code}\n" --max-time 10 http://127.0.0.1:3000/api/health'
          curl -sS -o /dev/null -w "public cms.cleanstart.com -> HTTP %{http_code}\n" --max-time 10 https://cms.cleanstart.com/api/health || true
