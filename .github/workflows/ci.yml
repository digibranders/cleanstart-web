name: CMS CI

# Only fire when something the CMS build/test path can actually be
# affected by changes. Mirrors Web CI's allow-list pattern. `!` patterns
# subtract from the allow-list above them. Branch-protection follow-up
# (when CMS CI becomes a required check) still needs an always-running
# `ci-passed` aggregator job so paths-filtered PRs don't get stuck.
on:
  push:
    branches: [main, development]
    paths:
      - 'apps/cms/**'
      - '!apps/cms/docs/**'
      - '!apps/cms/**/*.md'
      - 'packages/ui/**'
      - '!packages/ui/**/*.md'
      - 'packages/types/**'
      - 'packages/config/**'
      - 'pnpm-lock.yaml'
      - 'turbo.json'
      - '.github/workflows/ci.yml'
      - 'migrations/**'
  pull_request:
    branches: [main, development]
    paths:
      - 'apps/cms/**'
      - '!apps/cms/docs/**'
      - '!apps/cms/**/*.md'
      - 'packages/ui/**'
      - '!packages/ui/**/*.md'
      - 'packages/types/**'
      - 'packages/config/**'
      - 'pnpm-lock.yaml'
      - 'turbo.json'
      - '.github/workflows/ci.yml'
      - 'migrations/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24

jobs:
  cms:
    name: apps/cms · lint · typecheck · test · types-drift · build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cleanstart
          POSTGRES_PASSWORD: cleanstart
          POSTGRES_DB: cleanstart
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cleanstart -d cleanstart"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URI: postgres://cleanstart:cleanstart@localhost:5432/cleanstart
      PAYLOAD_SECRET: ci-only-not-a-real-secret
      PAYLOAD_PUBLIC_SERVER_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-
            turbo-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @cleanstart/cms lint

      - name: Typecheck
        run: pnpm --filter @cleanstart/cms typecheck

      - name: Test (with coverage)
        run: pnpm --filter @cleanstart/cms test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cms-coverage
          path: apps/cms/coverage/
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify generated Payload types are not stale
        run: pnpm --filter @cleanstart/cms verify:types

      - name: Verify @payloadcms/ui import allow-list (Wave 8 lock-in)
        run: pnpm --filter @cleanstart/cms verify:payload-ui

      - name: Verify every apps/web page has a pageRegistry row (Schema Manager + ⌘K search)
        run: pnpm --filter @cleanstart/cms verify:page-registry

      - name: Build
        run: pnpm --filter @cleanstart/cms build

      - name: Verify admin first-load bundle budget (Wave 8 part 2)
        run: pnpm --filter @cleanstart/cms verify:bundle-budget
        env:
          CMS_BUNDLE_BUDGET_BYTES_GZ: '512000'

  ui-ladle-build:
    name: packages/ui · Ladle build
    needs: cms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build Ladle stories
        run: pnpm --filter @cleanstart/ui ladle:build
      - name: Upload Ladle build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-ladle-build
          path: packages/ui/build/
          if-no-files-found: ignore
          retention-days: 14
